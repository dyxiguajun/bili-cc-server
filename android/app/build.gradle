plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.xigua.bilicc'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.xigua.bilicc'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/routeAssets'))
}

def routes = providers.gradleProperty('biliRoutesFile').map { rootProject.file(it) }
        .orElse(rootProject.file('default-routes.json'))
tasks.register('prepareRouteAssets', Copy) {
    from(routes)
    into(layout.buildDirectory.dir('generated/routeAssets'))
    rename { 'routes.json' }
}
tasks.named('preBuild') { dependsOn('prepareRouteAssets') }

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    testImplementation 'junit:junit:4.13.2'
}
