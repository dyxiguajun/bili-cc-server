name: bili-cc-server
services:
  app:
    image: bili-cc-server:2.0.4
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:${BILI_BIND_PORT:-18743}:8000"
    environment:
      BILI_PUBLIC_HOST: ${BILI_PUBLIC_HOST:-}
    volumes:
      - session_data:/var/lib/bili-cc
    read_only: true
    tmpfs:
      - /tmp:size=16777216,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    pids_limit: 64
    cpus: 1.0
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).close()"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 8s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  session_data:
