<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bili CC 设置</title>
  <link rel="stylesheet" href="options.css">
  <script type="module" src="options.js"></script>
</head>
<body>
  <main>
    <h1>Bili CC 设置</h1>
    <form id="settings">
      <label for="server">字幕服务的 HTTPS 地址</label>
      <div>
        <input id="server" type="url" placeholder="https://nas.example.ts.net:8443/" required>
        <button type="submit">保存</button>
      </div>
      <p id="status" role="status"></p>
    </form>
    <p>打开 B 站视频，再点击 Chrome 工具栏的 Bili CC 图标。</p>
  </main>
</body>
</html>
