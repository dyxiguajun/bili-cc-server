<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f4fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#201925">
  <title>Bili CC · B 站字幕提取</title>
  <link rel="icon" href="/static/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="Bili CC 首页">
        <img src="/static/icon-192.png" alt="" width="36" height="36">
        <span>Bili CC</span>
      </a>
      <div class="account">
        <span id="signed-in" class="account-state" hidden>已登录</span>
        <button id="login-button" class="secondary" type="button" hidden>登录 B 站</button>
        <button id="logout-button" class="quiet" type="button" hidden>退出登录</button>
      </div>
    </div>
  </header>
  <main class="shell">
    <div class="intro">
      <h1>B 站字幕提取</h1>
      <p>粘贴视频链接或 BV 号，一步提取并复制字幕。</p>
    </div>
    <div class="workspace">
      <form id="extract-form" class="panel">
        <label for="video-url">视频链接</label>
        <textarea id="video-url" name="video" rows="3" placeholder="https://www.bilibili.com/video/…" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="2048" required></textarea>
        <button id="extract-button" class="primary" type="submit">提取并复制</button>
        <p id="status" class="status" role="status"></p>
      </form>

      <section class="panel output" aria-labelledby="subtitle-label" aria-busy="false">
        <div class="output-bar">
          <h2 id="subtitle-label">字幕预览</h2>
          <select id="track" aria-label="字幕语言" hidden></select>
        </div>
        <div id="video-details" class="video-details" hidden>
          <a id="video-title" target="_blank" rel="noopener noreferrer"></a>
          <span id="video-part" class="video-part"></span>
        </div>
        <div class="reader">
          <div id="reader-placeholder" class="reader-placeholder">
            <span class="caption-icon" aria-hidden="true"></span>
            <p id="reader-message">提取后的字幕会显示在这里。</p>
          </div>
          <textarea id="subtitle" aria-labelledby="subtitle-label" readonly hidden></textarea>
        </div>
        <div class="output-actions">
          <button id="srt-button" class="quiet" type="button" disabled>下载 SRT</button>
          <button id="copy-button" class="secondary" type="button" disabled>复制字幕</button>
        </div>
      </section>
    </div>
  </main>

  <footer class="shell">XiGua · Corvallis, Oregon, USA · 20261119</footer>

  <dialog id="login-dialog" aria-labelledby="login-title">
    <div class="dialog-heading">
      <h2 id="login-title">登录 B 站</h2>
      <form method="dialog">
        <button type="submit" class="quiet" autofocus>关闭</button>
      </form>
    </div>
    <p class="dialog-note">用哔哩哔哩 App 扫码并确认。当前浏览器通过 NAS 保持登录。</p>
    <img id="qr-image" alt="哔哩哔哩登录二维码" width="196" height="196" hidden>
    <p id="login-status" class="status" role="status"></p>
    <div id="qr-actions" class="dialog-actions" hidden>
      <a id="qr-open" class="secondary" target="_blank" rel="noopener noreferrer">打开 B 站登录页</a>
      <a id="qr-save" class="quiet" download="bilibili-login.png">保存二维码</a>
    </div>
    <button id="qr-refresh" class="secondary" type="button" hidden>刷新二维码</button>
  </dialog>
</body>
</html>
